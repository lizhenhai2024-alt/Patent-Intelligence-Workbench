name: Publish RC Release

on:
  workflow_run:
    workflows: ["Windows Desktop Build"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish-rc:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified build commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release version
        id: release
        run: python -m app.release.versioning --github-output "$GITHUB_OUTPUT"

      - name: Download verified Windows artifact
        if: steps.release.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "PatentIntelligenceWorkbench-Windows" \
            --dir release-assets

      - name: Verify executable checksum
        if: steps.release.outputs.prerelease == 'true'
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS.txt

      - name: Publish idempotent prerelease
        if: steps.release.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$TAG" \
            release-assets/PatentIntelligenceWorkbench.exe \
            release-assets/BUILD_INFO.txt \
            release-assets/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target "$TARGET_SHA" \
            --title "Patent Intelligence Workbench $VERSION" \
            --prerelease \
            --notes "V1 release candidate. Deterministic Windows/Linux CI, offline end-to-end acceptance, packaged Windows smoke test and SHA-256 verification passed. See CHANGELOG.md and docs/QUICKSTART.md for details."

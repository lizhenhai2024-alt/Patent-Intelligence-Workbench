name: Windows Desktop Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[build]"

      - name: Build one-file desktop executable
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PatentIntelligenceWorkbench --collect-data app.resources app/desktop/main.py

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          & ".\dist\PatentIntelligenceWorkbench.exe" --smoke --data-dir "${{ runner.temp }}\piw-packaged-smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write build information
        shell: pwsh
        run: |
          "Patent Intelligence Workbench" | Out-File -Encoding utf8 ".\dist\BUILD_INFO.txt"
          "Commit: ${{ github.sha }}" | Out-File -Append -Encoding utf8 ".\dist\BUILD_INFO.txt"
          "Python: 3.12" | Out-File -Append -Encoding utf8 ".\dist\BUILD_INFO.txt"
          "Build: one-file / windowed" | Out-File -Append -Encoding utf8 ".\dist\BUILD_INFO.txt"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PatentIntelligenceWorkbench-Windows
          path: |
            dist/PatentIntelligenceWorkbench.exe
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

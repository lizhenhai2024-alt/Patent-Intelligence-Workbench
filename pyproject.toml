[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "patent-intelligence-workbench"
version = "1.0.0rc4"
description = "Patent search, family analysis, download and competitor patent watch workbench."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Zhenhai Li/Bruce" }
]
dependencies = [
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.8,<3",
]

[project.scripts]
patent-intelligence-workbench = "app.desktop.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "pytest-asyncio>=0.24,<1",
]
acquisition = [
  "crawl4ai>=0.9,<1",
  "markitdown>=0.1.7,<0.2",
]
browser = [
  "browser-use>=0.13,<1",
]
build = [
  "pyinstaller>=6.11,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/resources" = "app/resources"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
